name: Cypress Tests

on: 
  push: 
    branches: [ main, master ]
  schedule: 
    # every saturday at 01:00
    - cron: "0 1 * * 6"
    # daily at 03:00
    # - cron: "0 3 * * *"
  

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Install NPM dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run        
        uses: cypress-io/github-action@v6       
        with:
          build: npm install
          browser: firefox
        env: 
          CYPRESS_PASSWORD_CATALOGUER: ${{ secrets.CYPRESS_PASSWORD_CATALOGUER }}  
          CYPRESS_PASSWORD_LEXICOGRAPHER: ${{ secrets.CYPRESS_PASSWORD_LEXICOGRAPHER }}