name: Test against Container

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run tests daily at 23:30 UTC
    - cron: '30 23 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout BetMas (canonical compose stack)
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/BetMas
          path: BetMas

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}
        continue-on-error: false

      # `betmas` is the only private image; nginx + the full-profile
      # services (fuseki, collatex, qlever, iipsrv) are all public. Skip
      # counter-app: no published image, and out of scope for this suite.
      - name: Pull stack images
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full pull betmas nginx fuseki collatex qlever iipsrv

      - name: Clean up any existing stack
        if: always()
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full down -v || true

      - name: Start stack
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full up -d --no-build betmas nginx fuseki collatex qlever iipsrv

      - name: wait for install to finish
        timeout-minutes: 5
        run: |
          while ! docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml logs betmas 2>&1 | grep -q "Server has started"; \
          do sleep 2s; \
          done

      # The image ships without test users; create the accounts the @auth
      # specs log in with. Editors membership is required for the personal
      # page and newentry form (nav.xqm); Dillmann accounts use the
      # Cataloguers primary group (Dillmann accounts/createaccount.xql).
      # Goes straight to the eXist container (host port 8081, see the CI
      # override) since nginx doesn't route /exist/rest/db.
      # Note: a single quote in a secret would break the XQuery string literal.
      - name: Provision test users
        env:
          CYPRESS_PASSWORD_CATALOGUER: ${{ secrets.CYPRESS_PASSWORD_CATALOGUER }}
          CYPRESS_PASSWORD_LEXICOGRAPHER: ${{ secrets.CYPRESS_PASSWORD_LEXICOGRAPHER }}
        run: |
          curl -sf -u admin: -G http://localhost:8081/exist/rest/db \
            --data-urlencode "_query=if (sm:user-exists('JinntecCatalogue')) then 'user exists' else (sm:create-account('JinntecCatalogue', '${CYPRESS_PASSWORD_CATALOGUER}', 'Cataloguers'), sm:add-group-member('Editors', 'JinntecCatalogue'), 'user created')" \
            --data-urlencode "_wrap=no"
          curl -sf -u admin: -G http://localhost:8081/exist/rest/db \
            --data-urlencode "_query=if (sm:user-exists('JinntecLexicon')) then 'user exists' else (sm:create-account('JinntecLexicon', '${CYPRESS_PASSWORD_LEXICOGRAPHER}', 'Cataloguers'), 'user created')" \
            --data-urlencode "_wrap=no"

      # nginx is the app's origin now (matches prod: app at "/"), not the
      # bare eXist app-path base of the old single-container setup (#75).
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          browser: firefox
          install: npm ci
          config: baseUrl=http://localhost:8080/
          # note: '+' joins tag conditions with AND; space-separated would be OR
          expose: 'grepTags=-@production-only+-@perf,grepFilterSpecs=true,grepOmitFiltered=true'
          wait-on: http://localhost:8080/
          wait-on-timeout: 300
        env:
          CYPRESS_PASSWORD_CATALOGUER: ${{ secrets.CYPRESS_PASSWORD_CATALOGUER }}
          CYPRESS_PASSWORD_LEXICOGRAPHER: ${{ secrets.CYPRESS_PASSWORD_LEXICOGRAPHER }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-release-expanded
          path: cypress/screenshots
          retention-days: 7

      - name: Clean up stack
        if: always()
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full down -v || true
