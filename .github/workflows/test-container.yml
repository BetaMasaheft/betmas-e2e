name: Test against Container

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run tests daily at 23:30 UTC
    - cron: '30 23 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image-tag: ['6.4.0-expanded', 'release-expanded']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}
        continue-on-error: false

      - name: Pull Docker image
        run: |
          echo "Pulling Docker image..."
          docker pull ghcr.io/betamasaheft/betamasaheft:${{ matrix.image-tag }}

      - name: Clean up any existing container
        if: always()
        run: |
          docker stop betmas2 || true
          docker rm betmas2 || true

      - name: Start container
        run: |
          docker run \
            -dit -p 8080:8080 -p 8443:8443\
            --name betmas2 \
            ghcr.io/betamasaheft/betamasaheft:${{ matrix.image-tag }}

      - name: wait for install to finish
        timeout-minutes: 3
        run: |
          while ! docker logs betmas2 | grep -q "Server has started"; \
          do sleep 2s; \
          done

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          browser: firefox
          install: npm ci
          config: baseUrl=http://localhost:8080/exist/apps/BetMasWeb/
          wait-on: http://localhost:8080/exist/apps/BetMasWeb/
          # wait-on-timeout: 120

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots-${{ matrix.image-tag }}
          path: cypress/screenshots
          retention-days: 7

      - name: Clean up container
        if: always()
        run: |
          docker stop betmas2 || true
          docker rm betmas2 || true

