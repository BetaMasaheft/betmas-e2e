name: Test against Container

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run tests daily at 23:30 UTC
    - cron: '30 23 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}
        continue-on-error: false

      - name: Pull Docker image
        run: |
          echo "Pulling Docker image..."
          docker pull ghcr.io/betamasaheft/betamasaheft:release-expanded

      - name: Clean up any existing container
        if: always()
        run: |
          docker stop betmas2 || true
          docker rm betmas2 || true

      - name: Start container
        run: |
          docker run \
            -dit -p 8080:8080 -p 8443:8443\
            --name betmas2 \
            -e APP_URL=http://localhost:8080/exist/apps/BetMasWeb \
            ghcr.io/betamasaheft/betamasaheft:release-expanded

      - name: wait for install to finish
        timeout-minutes: 5
        run: |
          while ! docker logs betmas2 2>&1 | grep -q "Server has started"; \
          do sleep 2s; \
          done

      # The image ships without test users; create the cataloguer account the
      # @auth specs log in with. Editors membership is required for the
      # personal page and newentry form (nav.xqm). Note: a single quote in the
      # secret would break the XQuery string literal.
      - name: Provision cataloguer test user
        env:
          CYPRESS_PASSWORD_CATALOGUER: ${{ secrets.CYPRESS_PASSWORD_CATALOGUER }}
        run: |
          curl -sf -u admin: -G http://localhost:8080/exist/rest/db \
            --data-urlencode "_query=if (sm:user-exists('JinntecCatalogue')) then 'user exists' else (sm:create-account('JinntecCatalogue', '${CYPRESS_PASSWORD_CATALOGUER}', 'Cataloguers'), sm:add-group-member('Editors', 'JinntecCatalogue'), 'user created')" \
            --data-urlencode "_wrap=no"

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          browser: firefox
          install: npm ci
          config: baseUrl=http://localhost:8080/exist/apps/BetMasWeb/
          expose: 'grepTags=-@production-only,grepFilterSpecs=true,grepOmitFiltered=true'
          wait-on: http://localhost:8080/exist/apps/BetMasWeb/
          wait-on-timeout: 300
        env:
          CYPRESS_PASSWORD_CATALOGUER: ${{ secrets.CYPRESS_PASSWORD_CATALOGUER }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-release-expanded
          path: cypress/screenshots
          retention-days: 7

      - name: Clean up container
        if: always()
        run: |
          docker stop betmas2 || true
          docker rm betmas2 || true
