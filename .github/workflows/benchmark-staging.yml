name: Benchmarks against Staging

# Daily, same schedule as the container benchmark. Budgets fall back to the
# production ones (see cypress/fixtures/perf-budgets.json).
on:
  workflow_dispatch:
  schedule:
    # Daily at 02:30 UTC, same as the container benchmark
    - cron: '30 2 * * *'

permissions:
  # github-action-benchmark pushes the data series to gh-pages
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # cy.request timings are taken by the Cypress server process, so the
      # browser choice does not affect the numbers; default Electron is fine.
      - name: Run benchmark specs
        uses: cypress-io/github-action@v7
        with:
          install: npm ci
          config: baseUrl=https://betamasaheft.awhamburg.de/
          expose: 'grepTags=@perf,grepFilterSpecs=true,grepOmitFiltered=true'

      - name: Track results on gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Staging slow pages
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          benchmark-data-dir-path: bench/staging
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # report-only: alert on >150% regressions, never fail the run
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: '90'

  publish-pages:
    needs: bench
    uses: ./.github/workflows/publish-bench-pages.yml
    permissions:
      contents: write
