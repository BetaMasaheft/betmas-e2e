name: Publish benchmark chart pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/bench/**'
      - '.github/workflows/publish-bench-pages.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy chart pages
        run: bash pages/bench/publish.sh gh-pages

      - name: Push if changed
        working-directory: gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bench
          if git diff --staged --quiet; then
            echo 'no chart page changes'
            exit 0
          fi
          git commit -m 'chore(pages): refresh benchmark chart UI'
          git push
