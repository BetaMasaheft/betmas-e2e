name: Lighthouse audit (container)

# Same page set as lighthouse-prod.yml, audited against the canonical compose
# stack (BetMas image) — the counterpart of benchmark.yml. Paths come from
# lighthouserc.json with the production host swapped for localhost.
#
# Outputs: `lighthouse-reports-container` artifact (HTML + JSON per run), a job
# summary with scores and failing accessibility audits, and a score trend on
# gh-pages under lighthouse/container.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC — after the nightly container tests (23:30) and
    # the daily container benchmark (02:30)
    - cron: '0 4 * * 1'

permissions:
  # github-action-benchmark pushes the data series to gh-pages
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout BetMas (canonical compose stack)
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/BetMas
          path: BetMas

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}

      # `betmas` is the only private image; nginx + the full-profile services are all public.
      - name: Pull stack images
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full pull betmas nginx fuseki collatex qlever iipsrv

      - name: Clean up any existing stack
        if: always()
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full down -v || true

      - name: Start stack
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full up -d --no-build betmas nginx fuseki collatex qlever iipsrv

      - name: wait for install to finish
        timeout-minutes: 5
        run: |
          while ! docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml logs betmas 2>&1 | grep -q "Server has started"; \
          do sleep 2s; \
          done

      - name: Point config at the container
        run: sed 's#https://betamasaheft.eu#http://localhost:8080#' lighthouserc.json > lighthouserc.container.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.container.json
          uploadArtifacts: true
          artifactName: lighthouse-reports-container
          temporaryPublicStorage: false

      - name: Summarise scores
        if: always()
        run: node scripts/lighthouse-summary.mjs .lighthouseci >> "$GITHUB_STEP_SUMMARY"

      - name: Track scores on gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Lighthouse container scores
          tool: customBiggerIsBetter
          output-file-path: lighthouse-results.json
          benchmark-data-dir-path: lighthouse/container
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # report-only: alert on a >20% score drop, never fail the run
          alert-threshold: '80%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

      - name: Clean up stack
        if: always()
        run: |
          docker compose -f BetMas/docker-compose.yml -f .github/ci/docker-compose.ci-override.yml \
            --profile full down -v || true
